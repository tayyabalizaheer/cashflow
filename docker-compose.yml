services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: cashflow_root
      MYSQL_DATABASE: cashflow
      MYSQL_USER: cashflow
      MYSQL_PASSWORD: cashflow
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcashflow_root"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USERNAME: cashflow
      DATABASE_PASSWORD: cashflow
      DATABASE_NAME: cashflow
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "4000:4000"

volumes:
  mysql-data:
